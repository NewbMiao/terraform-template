# Install: pre-commit install --hook-type pre-commit --hook-type pre-push && pre-commit install-hooks
# Run: pre-commit run -a · pre-commit run terraform_checkov --all-files --hook-stage pre-push

default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.108.0
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
        args:
          - --args=-json=false
      - id: terraform_docs
        args:
          - --args=--config=.terraform-docs.yml
          - --hook-config=--path-to-file=README.md
          - --hook-config=--add-to-existing-file=true
          - --hook-config=--create-file-if-not-exist=false
      - id: terraform_checkov
        stages: [pre-push]
        args:
          - --args=--config-file=__GIT_WORKING_DIR__/.checkov.yaml

  - repo: local
    hooks:
      - id: terraform_validate_tflint
        name: tflint + OPA Rego tests
        entry: scripts/tflint-env.sh
        language: script
        require_serial: true
        files: \.(tf|tfvars)$|^\.tflint\.hcl$|^\.tflint\.d/policies/|^scripts/tflint-env\.sh$
      - id: tfpolicy_test
        name: tfpolicy (policies/)
        language: script
        entry: scripts/run-tfpolicy.sh
        args: [test]
        pass_filenames: false
        stages: [pre-commit]
        files: ^(base|infra|policies)/
      - id: block_tf_sensitive_paths
        name: block committed .env and tfstate
        language: script
        entry: scripts/pre-commit-block-sensitive-paths.sh
        pass_filenames: false
        stages: [pre-commit]
