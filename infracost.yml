# Cost scan catalogue (placeholder stacks — mostly $0 until you add real resources).
#   ./scripts/run-infracost.sh
# Requires: brew install infracost && INFRACOST_API_KEY (or INFRACOST_CLOUD_API_KEY)

version: 0.1

projects:
  - path: base/platform
    name: base-platform
    skip_autodetect: true

  - path: base/permissions
    name: base-permissions
    skip_autodetect: true

  - path: infra/teama
    name: teama-staging
    skip_autodetect: true
    terraform_var_files:
      - config/staging/environment.auto.tfvars
      - config/staging/workloads.auto.tfvars

  - path: infra/teama
    name: teama-prod
    skip_autodetect: true
    terraform_var_files:
      - config/prod/environment.auto.tfvars
      - config/prod/workloads.auto.tfvars

  - path: infra/teamb
    name: teamb-staging
    skip_autodetect: true
    terraform_var_files:
      - config/staging/environment.auto.tfvars
      - config/staging/workloads.auto.tfvars

  - path: infra/teamb
    name: teamb-prod
    skip_autodetect: true
    terraform_var_files:
      - config/prod/environment.auto.tfvars
      - config/prod/workloads.auto.tfvars
